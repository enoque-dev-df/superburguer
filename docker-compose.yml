
services:
  superburguer:
    build: .
    container_name: superburguer
    ports:
      - "IP_REAL_DO_SERVIDOR:5000:5000"
    environment:
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      SUPERBURGUER_USER: "${SUPERBURGUER_USER}"
      SUPERBURGUER_PASSWORD: "${SUPERBURGUER_PASSWORD}"
    restart: unless-stopped
